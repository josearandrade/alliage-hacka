services:
  api:
    image: alliage-hacka:latest
    command: ["python", "api.py"]
    ports:
      - "${ALLIAGE_API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      ALLIAGE_API_KEY: "${ALLIAGE_API_KEY:-}"
    volumes:
      - alliage-hf-cache:/app/data/hf_cache

volumes:
  alliage-hf-cache:
